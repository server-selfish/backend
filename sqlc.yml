    queries: "internal/domain/repository/project/project.sql"
    schema: "internal/domain/repository/db_schema/project.schema.sql"
    gen:
      go:
        package: "project_repository"
        out: "internal/domain/repository/project"
        sql_package: "pgx/v5"
