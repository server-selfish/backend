[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace"},
  { id = "detect-private-key"},
]

# Custom hooks defined in local repository
[[repos]]
repo = "local"
hooks = [
  # Format Go files. Commonly you want it to edit files, so this will fail the commit
  # if gofmt changes anything (you re-stage and re-commit).
  {
    id = "go-fmt",
    name = "gofmt",
    language = "system",
    entry = "gofmt -w",
    files = "\\.go$",
  },

  # Vet packages (not individual files). Because pre-commit/prek will append filenames,
  # we disable that and run on ./...
  {
    id = "go-vet",
    name = "go vet",
    language = "system",
    entry = "go vet ./...",
    pass_filenames = false,
    files = "\\.go$",
  },

  # "go lint": golint is deprecated; prefer golangci-lint.
  # This assumes you have golangci-lint installed on PATH.
  {
    id = "go-lint",
    name = "golangci-lint",
    language = "system",
    entry = "golangci-lint run",
    pass_filenames = false,
    files = "\\.go$",
  },
]
